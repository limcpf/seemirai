name: seemirai

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: seemirai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SEEMIRAI_POSTGRES_DB:-seemirai_local}
      POSTGRES_USER: ${SEEMIRAI_POSTGRES_USER:-seemirai}
      POSTGRES_PASSWORD: ${SEEMIRAI_POSTGRES_PASSWORD:-seemirai_local_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: UTC
    ports:
      - "127.0.0.1:${SEEMIRAI_POSTGRES_PORT:-55432}:5432"
    volumes:
      - ./.local/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${SEEMIRAI_POSTGRES_USER:-seemirai} -d ${SEEMIRAI_POSTGRES_DB:-seemirai_local}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
